<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#accent); }
    .subtitle { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 20px; fill: #94a3b8; letter-spacing: 1px; }
    .node-text { font-family: monospace; font-size: 13px; fill: #e2e8f0; font-weight: 600; }
    .pulse-line { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 20s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -1000; } }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1196" height="396" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Header Branding -->
  <g transform="translate(70, 140)">
    <text class="title" x="0" y="40">⚡ AST-Graph-DB</text>
    <text class="subtitle" x="0" y="85">Knowledge Graph &amp; Static Analysis Database</text>
    <text class="subtitle" x="0" y="115" fill="#64748b" font-size="16px">Multi-Language • Tree-Sitter • Cypher Query Engine • PageRank</text>
  </g>

  <!-- Right: Knowledge Graph Network Visualization -->
  <g transform="translate(780, 70)" filter="url(#glow-filter)">
    <!-- Edges -->
    <line x1="80" y1="130" x2="220" y2="70" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
    <line x1="80" y1="130" x2="240" y2="190" stroke="#818cf8" stroke-width="2.5" opacity="0.6"/>
    <line x1="220" y1="70" x2="310" y2="130" stroke="#c084fc" stroke-width="2.5" opacity="0.6"/>
    <line x1="240" y1="190" x2="310" y2="130" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
    <line x1="80" y1="130" x2="160" y2="240" stroke="#818cf8" stroke-width="2.5" opacity="0.6"/>

    <!-- Nodes -->
    <!-- File Node -->
    <circle cx="80" cy="130" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text class="node-text" x="80" y="135" text-anchor="middle">File</text>

    <!-- Class Node -->
    <circle cx="220" cy="70" r="26" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
    <text class="node-text" x="220" y="75" text-anchor="middle">Class</text>

    <!-- Function Node -->
    <circle cx="240" cy="190" r="28" fill="#0f172a" stroke="#c084fc" stroke-width="3"/>
    <text class="node-text" x="240" y="195" text-anchor="middle">Func</text>

    <!-- Target Call Node -->
    <circle cx="310" cy="130" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text class="node-text" x="310" y="135" text-anchor="middle">Call</text>

    <!-- Interface Node -->
    <circle cx="160" cy="240" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
    <text class="node-text" x="160" y="245" text-anchor="middle">Iface</text>
  </g>
</svg>
